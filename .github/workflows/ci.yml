name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的旧运行被新 push 取消，省 runner 时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Release 构建 + 全量 ctest。
  # ---------------------------------------------------------------------------
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GCC 13
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-13
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-gcc13
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  # ---------------------------------------------------------------------------
  # Clang 构建 + 全量 ctest（S12-6）。GCC 是主编译器；clang 作可移植性护栏——
  # 抓 gcc-ism（AVX-512 intrinsic 分支的 __GNUC__ 条件、`\x` 转义贪婪等 clang 更严
  # 之处）。Debug 配置：clang + Release LTO 需 LLVM gold 插件/lld，Debug 无 LTO 规避。
  # ---------------------------------------------------------------------------
  clang-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: debug-clang
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  # ---------------------------------------------------------------------------
  # -Werror 库构建（S12-7）。只对 first-party 开 -Werror 作新告警回归护栏——
  # BUILD_TESTING=OFF 且只建库目标（不含 bench/tests）；third_party 头已 SYSTEM 不受影响。
  # ---------------------------------------------------------------------------
  werror-lib:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GCC 13
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-13
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: werror-gcc13
      - name: Configure (-Werror, library only)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBITCASK_WERROR=ON \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build library (first-party warnings = errors)
        run: cmake --build build -j$(nproc) --target bitcask_static bitcask_shared

  # ---------------------------------------------------------------------------
  # CI2:Sanitizer matrix（ASAN+UBSAN / TSan），**全量 ctest**。TSan 是
  # Barrier v2 / IndexPool 并发协议 + 恢复期并行 fold/analyze 的唯一回归护栏；
  # TSan 构建用源码编译的插桩 oneTBB（submodule recursive 已拉取）。运行期
  # 选项设为「首个错误即 abort + 打栈」让 CI 失败确定可定位。
  #
  # S24 换 **clang**：gcc-13 的 ASan 在 -O0 下漏检 stack-use-after-scope
  # （2026-07-06 本地 clang 首跑抓出 6 个 gcc 矩阵长期漏过的预存 UB，含一处
  # 生产 misaligned float* 解引）；clang 是这批 bug 的实证检出器。C API 测试
  # 的 clang 链接问题由 tests/CMakeLists 的 LINKER_LANGUAGE CXX 解决。
  # ---------------------------------------------------------------------------
  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1:print_stacktrace=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # 按 sanitizer 分桶缓存（不同插桩 = 不同对象，含插桩 oneTBB）。
          key: san-${{ matrix.sanitizer }}-clang
      - name: Configure (${{ matrix.sanitizer }})
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBITCASK_SANITIZE=${{ matrix.sanitizer }} \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        # TSan 豁免 IndexPoolMultiLib.ThreadCountIndependentOfLibCount：既知
        # 预存失败（TASK.md S15/S20-8/S24 三度记录「未改动 HEAD 同样失败」），
        # 非回归信号；豁免使 TSan 全量成为硬门控。ASan 无豁免。
        run: |
          if [ "${{ matrix.sanitizer }}" = "thread" ]; then
            ctest --test-dir build --output-on-failure -j$(nproc) \
              -E 'IndexPoolMultiLib.ThreadCountIndependentOfLibCount'
          else
            ctest --test-dir build --output-on-failure -j$(nproc)
          fi

  # ---------------------------------------------------------------------------
  # CI3:Benchmark 追踪。构建并跑 B1-B4 + 既有微基准，产出 JSON artifact 供
  # 人工/趋势比对。**非门控**——GitHub 共享 runner CPU 噪声大，自动 >10% 回归
  # 报警会频繁误报；artifact 留作离线比对（CI3 的自动回归检测维度留待专用稳定机）。
  # ---------------------------------------------------------------------------
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GCC 13
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-13
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bench-gcc13
      - name: Configure
        run: |
          cmake -S . -B build-bench \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBITCASK_BUILD_BENCHMARKS=ON \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build bench
        run: cmake --build build-bench -j$(nproc) --target bitcask_bench
      - name: Run benchmarks (JSON)
        run: |
          ./build-bench/bench/bitcask_bench \
            --benchmark_format=json \
            --benchmark_out=bench-results.json \
            --benchmark_min_time=0.2s
      - name: Upload bench artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results.json
          retention-days: 30
